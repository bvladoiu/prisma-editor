#lair(root):gradle.properties
# ================== Kotlin Settings ==================
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048M
#Js
kotlin.js.ir.output.granularity=whole-program
# ================== Gradle Performance Settings ==================
# Enable Gradle's build cache for faster builds
org.gradle.caching=true
# Configure only necessary projects in multi-project builds (faster configuration)
# org.gradle.configureondemand=true
# JVM arguments for the main Gradle Daemon (increase if needed)
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED
# Explicitly set Java home for Gradle (Consider Gradle Toolchains for portability)
# org.gradle.java.home=D:/GradleHome/jdks/eclipse_adoptium-17-amd64-windows.2
# ================== Project Specific / Multiplatform Settings ==================
# Disable automatic MPP source set hierarchy (requires manual 'dependsOn')
kotlin.mpp.applyDefaultHierarchyTemplate=false
# Ignore Kotlin/Native targets disabled on the current host OS
kotlin.native.ignoreDisabledTargets=true
# Enable experimental JS Canvas for Compose Multiplatform (if used)
org.jetbrains.compose.experimental.jscanvas.enabled=true
# ================== Android Settings (Only relevant for Android modules) ==================
# Improve Android build times
android.nonTransitiveRClass=true
# Required for modern Android development
android.useAndroidX=true
# Suppresses warnings for potentially unsupported compileSdk versions (use with caution)
android.suppressUnsupportedCompileSdk=35
